<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Golden Setup Paper Bot</title>
<style>body{font-family:Arial,sans-serif;max-width:1100px;margin:30px auto;padding:0 16px;background:#f6f7f9;color:#111}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.card{background:white;border:1px solid #ddd;border-radius:12px;padding:16px}.price{font-size:30px;font-weight:700}.muted{color:#666}.event{padding:8px 0;border-bottom:1px solid #eee;font-size:13px}.ok{font-weight:700}</style></head>
<body><h1>Golden Setup — Paper Trading</h1><p class="muted">BTC + ETH • paper only • no exchange orders</p><div id="cards" class="grid"></div><div class="card" style="margin-top:16px"><h2>Recent events</h2><div id="events"></div></div>
<script>
async function refresh(){const r=await fetch('/api/status');const d=await r.json();let html='';for(const s of ['BTCUSDT','ETHUSDT']){const p=d.prices[s];const pos=d.positions[s];html+=`<div class="card"><h2>${s}</h2><div class="price">${p?p.toFixed(2):'—'}</div><p>Trades today: <b>${d.daily_trades[s]}</b> / 2</p><p>${pos?`<b>${pos.side}</b> @ ${pos.entry.toFixed(2)}<br>SL: ${pos.stop.toFixed(2)}<br>Qty: ${pos.qty.toFixed(6)}<br>Trail: ${pos.trail.active?'ACTIVE':'waiting'}`:'No open position'}</p></div>`}html+=`<div class="card"><h2>Paper Capital</h2><div class="price">$${d.capital.toFixed(2)}</div><p class="ok">PAPER MODE</p></div>`;document.getElementById('cards').innerHTML=html;document.getElementById('events').innerHTML=d.events.map(e=>`<div class="event"><b>${e.type}</b> ${e.symbol||''} ${e.side||''} @ ${e.price||''} ${e.reason?`— ${e.reason}`:''}</div>`).join('')||'No events yet'}
refresh();setInterval(refresh,5000);
</script></body></html>
